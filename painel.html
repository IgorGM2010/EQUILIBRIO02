<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EQUILÍBRIO - Painel de acompanhamento das salas do profissional.">
  <meta name="theme-color" content="#1D9E75">
  <title>Painel do Profissional - EQUILÍBRIO</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #DCF0F2;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .navbar {
      background: #FFFFFF;
      box-shadow: 0 2px 18px rgba(0, 0, 0, 0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      height: 70px;
      max-width: 1180px;
      margin: 0 auto;
      position: relative;
    }

    .navbar-logo a {
      color: #1D9E75;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .navbar-logo a:hover {
      color: #0F6E56;
    }

    .navbar-toggle {
      display: none;
      width: auto;
      min-height: auto;
      border: none;
      border-radius: 0;
      background: transparent;
      color: #333333;
      cursor: pointer;
      font-size: 24px;
      padding: 8px;
    }

    .navbar-toggle:hover {
      background: transparent;
      color: #1D9E75;
    }

    .navbar-nav {
      display: flex;
    }

    .nav-list {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-link {
      border-bottom: 2px solid transparent;
      color: #333333;
      font-size: 14px;
      font-weight: 500;
      padding-bottom: 2px;
      text-decoration: none;
    }

    .nav-link:hover {
      color: #1D9E75;
    }

    .nav-link-active {
      border-bottom-color: #1D9E75;
      color: #1D9E75;
      font-weight: 700;
    }

    .nav-link-active:hover {
      border-bottom-color: #0F6E56;
      color: #0F6E56;
    }

    .nav-user {
      color: #333333;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .nav-button {
      min-height: 44px;
      padding: 8px 16px;
      font-size: 14px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      background: #1D9E75;
      color: #FFFFFF;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      padding: 10px 18px;
    }

    button:hover {
      background: #0F6E56;
    }

    .button-secondary {
      background: #F2CB65;
      color: #333333;
    }

    .button-secondary:hover {
      background: #EEC44F;
    }

    .button-warning {
      background: #F2CB65;
      color: #333333;
    }

    .button-warning:hover {
      background: #EEC44F;
    }

    .button-danger {
      background: #A32D2D;
      color: #FFFFFF;
    }

    .button-danger:hover {
      background: #7F2020;
    }

    .container {
      max-width: 1180px;
      margin: 28px auto;
      padding: 0 20px 40px;
    }

    .page-title {
      margin: 0 0 18px;
      color: #333333;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 800;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }

    .card,
    .panel {
      background: #FFFFFF;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
    }

    .card {
      padding: 18px;
    }

    .card-label {
      margin: 0 0 8px;
      color: #1D9E75;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .card-value {
      color: #333333;
      font-size: 32px;
      line-height: 1;
      font-weight: 800;
    }

    .card-subtle {
      color: #666666;
      font-size: 14px;
      line-height: 1.4;
    }

    .panel {
      padding: 18px;
    }

    .panel-title {
      margin: 0 0 14px;
      color: #333333;
      font-size: 18px;
      font-weight: 800;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .panel-header .panel-title {
      margin: 0;
    }

    .create-room-form {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(220px, 1.4fr) auto;
      gap: 10px;
      margin-bottom: 16px;
    }

    .create-room-form input {
      min-height: 44px;
      border: 1px solid #DDDDDD;
      border-radius: 8px;
      color: #333333;
      font: inherit;
      font-size: 16px;
      padding: 10px 12px;
    }

    .create-room-form input:focus {
      outline: 3px solid rgba(29, 158, 117, 0.18);
      border-color: #1D9E75;
    }

    .form-message {
      display: none;
      margin-bottom: 14px;
      padding: 11px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .form-message.success {
      display: block;
      background: #E1F5EE;
      color: #0F6E56;
    }

    .form-message.error {
      display: block;
      background: #FCEBEB;
      color: #A32D2D;
    }

    .room-action-modal {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(8, 80, 65, 0.28);
      backdrop-filter: blur(2px);
    }

    .room-action-modal.is-open {
      display: flex;
    }

    .room-action-card {
      width: 100%;
      max-width: 420px;
      padding: 26px;
      background: #FFFFFF;
      border-radius: 14px;
      box-shadow: 0 18px 44px rgba(29, 158, 117, 0.18);
      animation: roomActionIn 180ms ease forwards;
    }

    .room-action-title {
      margin: 0 0 10px;
      color: #1D9E75;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 800;
      text-align: center;
    }

    .room-action-text {
      margin: 0 0 20px;
      color: #333333;
      font-size: 15px;
      line-height: 1.55;
      text-align: center;
      white-space: pre-line;
    }

    .room-action-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .room-action-actions.is-single {
      grid-template-columns: 1fr;
    }

    .room-action-confirm.is-warning {
      background: #F2CB65;
      color: #333333;
    }

    .room-action-confirm.is-warning:hover {
      background: #EEC44F;
    }

    .room-action-confirm.is-danger {
      background: #A32D2D;
      color: #FFFFFF;
    }

    .room-action-confirm.is-danger:hover {
      background: #7F2020;
    }

    @keyframes roomActionIn {
      from {
        opacity: 0;
        transform: translateY(6px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .room-list {
      display: grid;
      gap: 10px;
    }

    .room-item {
      width: 100%;
      border: 1px solid #EEEEEE;
      border-radius: 8px;
      background: #FFFFFF;
      color: #333333;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 14px;
      padding: 14px;
      text-align: left;
      box-shadow: none;
    }

    .room-item:hover {
      background: #F5FFFA;
      border-color: #1D9E75;
    }

    .room-name {
      color: #333333;
      font-size: 15px;
      font-weight: 800;
    }

    .room-code,
    .room-meta {
      color: #666666;
      font-size: 13px;
      font-weight: 600;
    }

    .details {
      display: none;
    }

    .details.active {
      display: block;
    }

    .details-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .details-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 18px 0;
    }

    .chart-card {
      min-height: 320px;
      padding: 18px;
      background: #FFFFFF;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
    }

    .chart-card h3 {
      margin: 0 0 12px;
      color: #1D9E75;
      font-size: 15px;
      font-weight: 800;
    }

    .table-panel {
      overflow-x: auto;
      background: #FFFFFF;
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
      padding: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
    }

    th,
    td {
      padding: 11px 10px;
      border-bottom: 1px solid #EEEEEE;
      font-size: 13px;
      text-align: left;
    }

    th {
      color: #1D9E75;
      font-weight: 800;
    }

    .empty {
      padding: 22px;
      color: #666666;
      text-align: center;
      background: #F7F7F7;
      border-radius: 8px;
      font-size: 14px;
    }

    @media (max-width: 820px) {
      .stats-grid,
      .charts-grid {
        grid-template-columns: 1fr;
      }

      .details-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .details-actions {
        width: 100%;
      }

      .details-actions button {
        width: 100%;
      }

      .panel-header,
      .create-room-form {
        grid-template-columns: 1fr;
      }

      .panel-header {
        align-items: stretch;
        flex-direction: column;
      }

      .navbar-container {
        height: 60px;
        padding: 0 16px;
      }

      .navbar-logo a {
        font-size: 18px;
      }

      .navbar-toggle {
        display: inline-flex;
        margin-left: auto;
      }

      .nav-list {
        align-items: stretch;
        background: #FFFFFF;
        border-radius: 12px;
        box-shadow: 0 4px 32px rgba(0, 0, 0, 0.07);
        display: none;
        flex-direction: column;
        gap: 14px;
        min-width: 220px;
        padding: 16px;
        position: absolute;
        right: 16px;
        top: 60px;
      }

      .nav-list.active {
        display: flex;
      }

      .nav-link {
        display: block;
        font-size: 13px;
        padding: 8px 4px;
      }

      .nav-user {
        border-top: 1px solid #EEEEEE;
        padding: 12px 4px 0;
        white-space: normal;
      }

      .nav-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar-container">
      <div class="navbar-logo">
        <a href="index.html">EQUILÍBRIO</a>
      </div>
      <button class="navbar-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="navList">☰</button>
      <nav class="navbar-nav" aria-label="Navegação do painel">
        <ul id="navList" class="nav-list">
          <li><span id="userName" class="nav-user">Carregando...</span></li>
          <li><button class="nav-button" type="button" onclick="fazerLogout()">Sair</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="dashboardView">
      <h1 class="page-title">Dashboard</h1>
      <div id="statsGrid" class="stats-grid"></div>

      <section class="panel">
        <div class="panel-header">
          <h2 class="panel-title">Suas salas</h2>
        </div>
        <form id="createRoomForm" class="create-room-form">
          <input id="roomNameInput" type="text" autocomplete="off" maxlength="100" placeholder="Nome da sala" aria-label="Nome da sala" required>
          <input id="roomDescriptionInput" type="text" autocomplete="off" maxlength="500" placeholder="Descrição opcional" aria-label="Descrição opcional da sala">
          <button id="createRoomBtn" type="submit">Criar sala</button>
        </form>
        <div id="createRoomMessage" class="form-message" role="status" aria-live="polite"></div>
        <div id="roomsList" class="room-list"></div>
      </section>
    </section>

    <section id="detailsView" class="details">
      <div class="details-header">
        <div>
          <h1 id="roomTitle" class="page-title">Sala</h1>
          <div id="roomSubtitle" class="card-subtle"></div>
        </div>
        <div class="details-actions">
          <button class="button-secondary" type="button" onclick="voltarDashboard()">Voltar</button>
          <button id="closeRoomBtn" class="button-warning" type="button" onclick="fecharSalaAtual()">Fechar sala</button>
          <button id="deleteRoomBtn" class="button-danger" type="button" onclick="excluirSalaAtual()">Excluir sala</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="card">
          <p class="card-label">Participantes</p>
          <div id="detailParticipants" class="card-value">0</div>
        </div>
        <div class="card">
          <p class="card-label">Última atividade</p>
          <div id="detailLastActivity" class="card-subtle">-</div>
        </div>
        <div class="card">
          <p class="card-label">Status</p>
          <div id="detailStatus" class="card-subtle">-</div>
        </div>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <h3>Indicadores médios</h3>
          <canvas id="indicatorsChart"></canvas>
        </div>
        <div class="chart-card">
          <h3>Distribuição de perfis</h3>
          <canvas id="profilesChart"></canvas>
        </div>
      </div>

      <div class="table-panel">
        <h2 class="panel-title">Participantes</h2>
        <table id="participantsTable" role="table" aria-label="Resultados dos participantes"></table>
      </div>
    </section>
  </main>

  <div id="roomActionModal" class="room-action-modal" role="dialog" aria-modal="true" aria-labelledby="roomActionTitle" aria-hidden="true">
    <section class="room-action-card">
      <h2 id="roomActionTitle" class="room-action-title"></h2>
      <p id="roomActionText" class="room-action-text"></p>
      <div id="roomActionActions" class="room-action-actions">
        <button id="roomActionCancel" class="button-secondary" type="button">Cancelar</button>
        <button id="roomActionConfirm" class="room-action-confirm" type="button">Confirmar</button>
      </div>
    </section>
  </div>

  <script>
    const BACKEND_URL = (() => {
      const configured = window.EQUILIBRIO_BACKEND_URL;
      if (configured) {
        return configured.replace(/\/$/, "");
      }

      const host = window.location.hostname;
      if (!host || host === "localhost" || host === "127.0.0.1") {
        return "http://localhost:3001";
      }

      return window.location.origin;
    })();

    let token = localStorage.getItem("token");
    let professionalId = localStorage.getItem("professionalId");
    let professionalNome = localStorage.getItem("professionalNome");
    let chartsAtuais = {};
    let salasPorId = {};
    let salaSelecionadaId = null;
    let resolverModalSala = null;

    document.addEventListener("DOMContentLoaded", () => {
      const toggle = document.querySelector(".navbar-toggle");
      const navList = document.querySelector(".nav-list");

      toggle.addEventListener("click", () => {
        const isOpen = navList.classList.toggle("active");
        toggle.setAttribute("aria-expanded", String(isOpen));
      });

      navList.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          navList.classList.remove("active");
          toggle.setAttribute("aria-expanded", "false");
        });
      });

      if (!token || !professionalId) {
        window.location.href = "login.html";
        return;
      }

      document.getElementById("userName").textContent = professionalNome || "Profissional";
      document.getElementById("createRoomForm").addEventListener("submit", criarSala);
      document.getElementById("roomActionCancel").addEventListener("click", () => fecharModalAcaoSala(false));
      document.getElementById("roomActionConfirm").addEventListener("click", () => fecharModalAcaoSala(true));
      document.getElementById("roomActionModal").addEventListener("click", (event) => {
        if (event.target.id === "roomActionModal") {
          fecharModalAcaoSala(false);
        }
      });
      carregarDashboard();
    });

    function authHeaders() {
      return {
        Authorization: `Bearer ${token}`
      };
    }

    function formatDate(timestamp) {
      if (!timestamp) {
        return "-";
      }

      return new Date(timestamp).toLocaleString("pt-BR");
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function perfilLabel(perfil) {
      const labels = {
        autocritico: "Autocrítico",
        evitador: "Evitador",
        sobrecarregado: "Sobrecarregado",
        equilibrado: "Equilibrado"
      };

      return labels[perfil] || perfil || "-";
    }

    function fazerLogout() {
      localStorage.removeItem("token");
      localStorage.removeItem("professionalId");
      localStorage.removeItem("professionalNome");
      window.location.href = "login.html";
    }

    async function fetchJson(url) {
      const response = await fetch(url, {
        headers: authHeaders()
      });

      const data = await response.json();

      if (response.status === 401) {
        fazerLogout();
        return null;
      }

      if (!response.ok || !data.sucesso) {
        throw new Error(data.erro || "Erro ao carregar dados");
      }

      return data;
    }

    function showCreateRoomMessage(text, type) {
      const message = document.getElementById("createRoomMessage");
      message.textContent = text;
      message.className = `form-message ${type}`;
    }

    function abrirModalAcaoSala({ titulo, texto, confirmar = "Confirmar", cancelar = "Cancelar", tipo = "warning", somenteAviso = false }) {
      const modal = document.getElementById("roomActionModal");
      const title = document.getElementById("roomActionTitle");
      const text = document.getElementById("roomActionText");
      const actions = document.getElementById("roomActionActions");
      const cancelButton = document.getElementById("roomActionCancel");
      const confirmButton = document.getElementById("roomActionConfirm");

      title.textContent = titulo;
      text.textContent = texto;
      cancelButton.textContent = cancelar;
      confirmButton.textContent = confirmar;
      cancelButton.hidden = somenteAviso;
      actions.classList.toggle("is-single", somenteAviso);
      confirmButton.className = `room-action-confirm is-${tipo}`;
      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");

      window.setTimeout(() => {
        confirmButton.focus();
      }, 50);

      return new Promise((resolve) => {
        resolverModalSala = resolve;
      });
    }

    function fecharModalAcaoSala(confirmado) {
      const modal = document.getElementById("roomActionModal");
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");

      if (resolverModalSala) {
        resolverModalSala(Boolean(confirmado));
        resolverModalSala = null;
      }
    }

    async function mostrarAvisoSala(titulo, texto, tipo = "warning") {
      await abrirModalAcaoSala({
        titulo,
        texto,
        confirmar: "Entendi",
        tipo,
        somenteAviso: true
      });
    }

    async function criarSala(event) {
      event.preventDefault();

      const nomeInput = document.getElementById("roomNameInput");
      const descricaoInput = document.getElementById("roomDescriptionInput");
      const createBtn = document.getElementById("createRoomBtn");
      const nome = nomeInput.value.trim();
      const descricao = descricaoInput.value.trim();

      if (nome.length < 2) {
        showCreateRoomMessage("Informe um nome com pelo menos 2 caracteres.", "error");
        nomeInput.focus();
        return;
      }

      createBtn.disabled = true;
      createBtn.textContent = "Criando...";
      document.getElementById("createRoomMessage").className = "form-message";

      try {
        const response = await fetch(`${BACKEND_URL}/api/salas`, {
          method: "POST",
          headers: {
            ...authHeaders(),
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ nome, descricao })
        });

        const data = await response.json();

        if (response.status === 401) {
          fazerLogout();
          return;
        }

        if (!response.ok || !data.sucesso) {
          throw new Error(data.erro || "Erro ao criar sala");
        }

        nomeInput.value = "";
        descricaoInput.value = "";
        showCreateRoomMessage(`Sala criada. Código: ${data.sala.codigo}`, "success");
        await carregarDashboard();
      } catch (err) {
        showCreateRoomMessage(err.message || "Erro ao criar sala.", "error");
      } finally {
        createBtn.disabled = false;
        createBtn.textContent = "Criar sala";
      }
    }

    async function carregarDashboard() {
      try {
        const data = await fetchJson(`${BACKEND_URL}/api/analises/dashboard`);
        if (!data) {
          return;
        }

        salasPorId = {};
        data.salas.forEach((sala) => {
          salasPorId[sala.id] = sala;
        });

        document.getElementById("statsGrid").innerHTML = `
          <div class="card">
            <p class="card-label">Salas ativas</p>
            <div class="card-value">${data.salas_ativas}</div>
          </div>
          <div class="card">
            <p class="card-label">Participantes</p>
            <div class="card-value">${data.total_participantes}</div>
          </div>
          <div class="card">
            <p class="card-label">Última atividade</p>
            <div class="card-subtle">${formatDate(data.ultima_atividade)}</div>
          </div>
        `;

        if (!data.salas.length) {
          const mensagemVazia = data.aviso || "Nenhuma sala criada ainda.";
          document.getElementById("roomsList").innerHTML = `<div class="empty">${escapeHtml(mensagemVazia)}</div>`;
          return;
        }

        document.getElementById("roomsList").innerHTML = data.salas.map((sala) => `
          <button class="room-item" type="button" onclick="abrirSala('${sala.id}')">
            <div>
              <div class="room-name">${escapeHtml(sala.nome)}</div>
              <div class="room-code">Código: ${escapeHtml(sala.codigo)}</div>
            </div>
            <div class="room-meta">${escapeHtml(sala.status)} | ${sala.participantes} participante(s)</div>
          </button>
        `).join("");
      } catch (err) {
        await mostrarAvisoSala("Erro ao carregar dashboard", err.message || "Não foi possível carregar o dashboard.", "danger");
      }
    }

    async function abrirSala(salaId) {
      const sala = salasPorId[salaId] || {};
      salaSelecionadaId = salaId;
      document.getElementById("dashboardView").style.display = "none";
      document.getElementById("detailsView").classList.add("active");
      document.getElementById("roomTitle").textContent = sala.nome || "Sala";
      document.getElementById("roomSubtitle").textContent = sala.codigo ? `Código: ${sala.codigo}` : "";
      document.getElementById("detailStatus").textContent = sala.status || "-";
      document.getElementById("closeRoomBtn").hidden = sala.status === "encerrada";

      try {
        const data = await fetchJson(`${BACKEND_URL}/api/analises/sala/${salaId}`);
        if (!data) {
          return;
        }

        const analises = data.analises;
        document.getElementById("detailParticipants").textContent = analises.total_participantes;
        document.getElementById("detailLastActivity").textContent = analises.sessoes.length
          ? formatDate(analises.sessoes[0].timestamp)
          : "-";

        renderizarGraficoIndicadores(analises.medias);
        renderizarGraficoPerfis(analises.distribuicao_perfis);
        renderizarTabela(analises.sessoes);
      } catch (err) {
        await mostrarAvisoSala("Erro ao carregar análises", err.message || "Não foi possível carregar as análises da sala.", "danger");
        voltarDashboard();
      }
    }

    function voltarDashboard() {
      salaSelecionadaId = null;
      document.getElementById("dashboardView").style.display = "block";
      document.getElementById("detailsView").classList.remove("active");

      if (chartsAtuais.indicadores) {
        chartsAtuais.indicadores.destroy();
      }

      if (chartsAtuais.perfis) {
        chartsAtuais.perfis.destroy();
      }
    }

    async function fecharSalaAtual() {
      if (!salaSelecionadaId) {
        return;
      }

      const sala = salasPorId[salaSelecionadaId] || {};
      const confirmado = await abrirModalAcaoSala({
        titulo: "Fechar sala?",
        texto: `Deseja realmente fechar a sala "${sala.nome || "selecionada"}"?\n\nEla não aceitará mais respostas e não poderá ser aberta novamente.`,
        confirmar: "Fechar sala",
        cancelar: "Cancelar",
        tipo: "warning"
      });

      if (!confirmado) {
        return;
      }

      try {
        const response = await fetch(`${BACKEND_URL}/api/salas/${salaSelecionadaId}/status`, {
          method: "PUT",
          headers: {
            ...authHeaders(),
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ status: "encerrada" })
        });

        const data = await response.json();

        if (response.status === 401) {
          fazerLogout();
          return;
        }

        if (!response.ok || !data.sucesso) {
          throw new Error(data.erro || "Erro ao fechar sala");
        }

        salasPorId[salaSelecionadaId].status = "encerrada";
        document.getElementById("detailStatus").textContent = "encerrada";
        document.getElementById("closeRoomBtn").hidden = true;
        await carregarDashboard();
        await mostrarAvisoSala("Sala fechada", "A sala foi fechada com sucesso e não aceitará mais respostas.", "warning");
      } catch (err) {
        await mostrarAvisoSala("Erro ao fechar sala", err.message || "Não foi possível fechar a sala. Tente novamente.", "danger");
      }
    }

    async function excluirSalaAtual() {
      if (!salaSelecionadaId) {
        return;
      }

      const sala = salasPorId[salaSelecionadaId] || {};
      const confirmado = await abrirModalAcaoSala({
        titulo: "Excluir sala?",
        texto: `Deseja realmente excluir a sala "${sala.nome || "selecionada"}"?\n\nA sala e todos os dados vinculados a ela serão excluídos do banco de dados. Esta ação não pode ser desfeita.`,
        confirmar: "Excluir sala",
        cancelar: "Cancelar",
        tipo: "danger"
      });

      if (!confirmado) {
        return;
      }

      try {
        const response = await fetch(`${BACKEND_URL}/api/salas/${salaSelecionadaId}`, {
          method: "DELETE",
          headers: authHeaders()
        });

        const data = await response.json();

        if (response.status === 401) {
          fazerLogout();
          return;
        }

        if (!response.ok || !data.sucesso) {
          throw new Error(data.erro || "Erro ao excluir sala");
        }

        await mostrarAvisoSala("Sala excluída", "A sala e seus dados vinculados foram excluídos com sucesso.", "danger");
        voltarDashboard();
        await carregarDashboard();
      } catch (err) {
        await mostrarAvisoSala("Erro ao excluir sala", err.message || "Não foi possível excluir a sala. Tente novamente.", "danger");
      }
    }

    function renderizarTabela(sessoes) {
      if (!sessoes.length) {
        document.getElementById("participantsTable").innerHTML = `
          <tr><td class="empty">Nenhum participante nesta sala.</td></tr>
        `;
        return;
      }

      document.getElementById("participantsTable").innerHTML = `
        <thead>
          <tr>
            <th>Nick</th>
            <th>Perfil</th>
            <th>Pensamento</th>
            <th>Emoção</th>
            <th>Comportamento</th>
            <th>Saúde física</th>
            <th>Data</th>
          </tr>
        </thead>
        <tbody>
          ${sessoes.map((sessao) => `
            <tr>
              <td>${escapeHtml(sessao.estudante_nick || "(Anônimo)")}</td>
              <td>${escapeHtml(perfilLabel(sessao.perfil))}</td>
              <td>${sessao.indicadores.p}%</td>
              <td>${sessao.indicadores.e}%</td>
              <td>${sessao.indicadores.c}%</td>
              <td>${sessao.indicadores.s}%</td>
              <td>${formatDate(sessao.timestamp)}</td>
            </tr>
          `).join("")}
        </tbody>
      `;
    }

    function renderizarGraficoIndicadores(medias) {
      if (chartsAtuais.indicadores) {
        chartsAtuais.indicadores.destroy();
      }

      const ctx = document.getElementById("indicatorsChart").getContext("2d");
      chartsAtuais.indicadores = new Chart(ctx, {
        type: "bar",
        data: {
          labels: ["Pensamento", "Emoção", "Comportamento", "Saúde física"],
          datasets: [{
            label: "Média",
            data: [medias.p, medias.e, medias.c, medias.s],
            backgroundColor: ["#F2CB65", "#D4537E", "#C9A0D0", "#1D9E75"],
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 100,
              ticks: {
                callback(value) {
                  return value + "%";
                }
              }
            }
          }
        }
      });
    }

    function renderizarGraficoPerfis(distribuicao) {
      if (chartsAtuais.perfis) {
        chartsAtuais.perfis.destroy();
      }

      const ctx = document.getElementById("profilesChart").getContext("2d");
      chartsAtuais.perfis = new Chart(ctx, {
        type: "doughnut",
        data: {
          labels: ["Autocríticos", "Evitadores", "Sobrecarregados", "Equilibrados"],
          datasets: [{
            data: [
              distribuicao.autocriticos,
              distribuicao.evitadores,
              distribuicao.sobrecarregados,
              distribuicao.equilibrados
            ],
            backgroundColor: ["#F2CB65", "#C9A0D0", "#BA7517", "#1D9E75"],
            borderColor: "#FFFFFF",
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: "bottom"
            }
          }
        }
      });
    }
  </script>
</body>
</html>
