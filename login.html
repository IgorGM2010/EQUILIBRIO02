<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="EQUILÍBRIO - Acesso ao painel do profissional.">
  <meta name="theme-color" content="#1D9E75">
  <title>Login - Painel EQUILÍBRIO</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      background: #DCF0F2;
      color: #333333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .navbar {
      background: #FFFFFF;
      box-shadow: 0 2px 18px rgba(0, 0, 0, 0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-container {
      max-width: 1180px;
      height: 70px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .navbar-logo a {
      color: #1D9E75;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0;
      text-decoration: none;
    }

    .navbar-toggle {
      display: none;
      width: auto;
      min-height: auto;
      border: none;
      border-radius: 0;
      background: transparent;
      color: #333333;
      cursor: pointer;
      font-size: 24px;
      padding: 8px;
    }

    .navbar-toggle:hover {
      background: transparent;
      color: #1D9E75;
    }

    .navbar-nav {
      display: flex;
    }

    .nav-list {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .nav-link {
      border-bottom: 2px solid transparent;
      color: #333333;
      font-size: 14px;
      font-weight: 500;
      padding-bottom: 2px;
      text-decoration: none;
    }

    .nav-link:hover {
      color: #1D9E75;
    }

    .nav-link-active {
      border-bottom-color: #1D9E75;
      color: #1D9E75;
      font-weight: 700;
    }

    .nav-link-active:hover {
      border-bottom-color: #0F6E56;
      color: #0F6E56;
    }

    .login-page {
      width: 100%;
      min-height: calc(100vh - 70px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 36px;
      background: #FFFFFF;
      border-radius: 10px;
      box-shadow: 0 18px 44px rgba(29, 158, 117, 0.13);
    }

    .logo {
      margin: 0 0 6px;
      color: #1D9E75;
      text-align: center;
      font-size: 34px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #666666;
      text-align: center;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #333333;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 44px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #DDDDDD;
      border-radius: 8px;
      color: #333333;
      font: inherit;
      font-size: 16px;
    }

    input:focus {
      outline: 3px solid rgba(29, 158, 117, 0.18);
      border-color: #1D9E75;
    }

    button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 999px;
      background: #1D9E75;
      color: #FFFFFF;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
    }

    button:hover {
      background: #0F6E56;
    }

    button:disabled {
      background: #BDBDBD;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: #FCEBEB;
      color: #A32D2D;
    }

    .message.success {
      display: block;
      background: #E1F5EE;
      color: #0F6E56;
    }

    .hint {
      margin-top: 24px;
      padding: 12px;
      border-radius: 8px;
      background: #F5FFFA;
      color: #666666;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }

    @media (max-width: 820px) {
      .navbar-container {
        height: 60px;
        padding: 0 16px;
      }

      .navbar-logo a {
        font-size: 18px;
      }

      .navbar-toggle {
        display: inline-flex;
        margin-left: auto;
      }

      .nav-list {
        align-items: stretch;
        background: #FFFFFF;
        border-radius: 12px;
        box-shadow: 0 4px 32px rgba(0, 0, 0, 0.07);
        display: none;
        flex-direction: column;
        gap: 14px;
        min-width: 220px;
        padding: 16px;
        position: absolute;
        right: 16px;
        top: 60px;
      }

      .nav-list.active {
        display: flex;
      }

      .nav-link {
        display: block;
        font-size: 13px;
        padding: 8px 4px;
      }

      .login-page {
        min-height: calc(100vh - 60px);
        padding: 22px 16px;
      }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="navbar-container">
      <div class="navbar-logo">
        <a href="index.html">EQUILÍBRIO</a>
      </div>
      <button class="navbar-toggle" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="navList">☰</button>
      <nav class="navbar-nav" aria-label="Navegação principal">
        <ul id="navList" class="nav-list">
          <li><a href="index.html" class="nav-link">Início</a></li>
          <li><a href="jogar.html" class="nav-link">Jogar</a></li>
          <li><a href="painel.html" class="nav-link nav-link-active">Painel do profissional</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="login-page">
    <section class="login-card">
    <h1 class="logo">EQUILÍBRIO</h1>
      <p class="subtitle">Painel do Profissional</p>

      <form id="loginForm">
        <label for="nome">Nome de usuário</label>
        <input id="nome" type="text" autocomplete="username" aria-label="Nome de usuário" required>

        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" aria-label="Senha" required>

        <button id="loginBtn" type="submit">Entrar</button>
      </form>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <div class="hint">
        Solicite o seu acesso em: suporteequilibrio@hotmail.com
      </div>
    </section>
  </main>

  <script>
    const BACKEND_URL = (() => {
      const configured = window.EQUILIBRIO_BACKEND_URL;
      if (configured) {
        return configured.replace(/\/$/, "");
      }

      const host = window.location.hostname;
      if (!host || host === "localhost" || host === "127.0.0.1") {
        return "http://localhost:3001";
      }

      return window.location.origin;
    })();

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");

    document.addEventListener("DOMContentLoaded", () => {
      const toggle = document.querySelector(".navbar-toggle");
      const navList = document.querySelector(".nav-list");

      toggle.addEventListener("click", () => {
        const isOpen = navList.classList.toggle("active");
        toggle.setAttribute("aria-expanded", String(isOpen));
      });

      navList.querySelectorAll("a").forEach((link) => {
        link.addEventListener("click", () => {
          navList.classList.remove("active");
          toggle.setAttribute("aria-expanded", "false");
        });
      });

      if (localStorage.getItem("token")) {
        window.location.href = "painel.html";
      }
    });

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const senha = document.getElementById("senha").value.trim();

      message.className = "message";
      message.textContent = "";

      if (!nome || !senha) {
        showMessage("Preencha todos os campos.", "error");
        return;
      }

      if (senha.length < 6) {
        showMessage("Dados inválidos.", "error");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Verificando...";

      try {
        const response = await fetch(`${BACKEND_URL}/api/auth/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ nome, senha })
        });

        const data = await response.json();

        if (!response.ok || !data.sucesso) {
          showMessage(data.erro || "Erro ao fazer login.", "error");
          return;
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("professionalId", data.profissional.id);
        localStorage.setItem("professionalNome", data.profissional.nome);

        showMessage("Login realizado com sucesso.", "success");
        window.setTimeout(() => {
          window.location.href = "painel.html";
        }, 600);
      } catch (err) {
        showMessage("Erro de conexão. Verifique se o backend está ativo.", "error");
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
